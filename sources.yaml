# Which sources the app scrapes. Set `enabled: false` to turn one off.
#
# Only tech listings whose source states a posting date within the last 48 hours
# are kept; everything else is dropped. Built-in sources are fetched with Scrapling.

refresh_hours: 2   # don't re-scrape a source more often than this

builtin:
  # --- jobs ---
  companies:    { enabled: true }   # career boards of the companies listed below
  early_career: { enabled: true }   # SimplifyJobs internship + new-grad lists, New-Grad-2027
  yc:           { enabled: true }   # Y Combinator startup jobs (HTML page, scraped)
  hn_hiring:    { enabled: true }   # "Ask HN: Who is hiring?" monthly thread
  himalayas:    { enabled: true }   # remote tech jobs API
  jobicy:       { enabled: true }   # remote jobs API (dev, engineering, data science)
  wwr:          { enabled: true }   # We Work Remotely, 6 RSS feeds
  arbeitnow:    { enabled: true }   # Europe (mostly Germany), on-site and remote
  remoteok:       { enabled: true } # Remote OK, public JSON API
  remotive:       { enabled: true } # Remotive, public JSON API
  working_nomads: { enabled: true } # Working Nomads, public JSON API
  nodesk:         { enabled: true } # NoDesk, RSS feed
  dailyremote:    { enabled: true } # DailyRemote: software, data, DevOps, design pages
  # --- Kenyan job boards ---
  myjobmag:       { enabled: true }  # MyJobMag Kenya, IT section
  brightermonday: { enabled: true }  # BrighterMonday Kenya, Software & Data section
  jobwebkenya:    { enabled: true }  # Jobweb Kenya, RSS feed (all fields, filtered to tech)
  corporate_staffing: { enabled: true }  # Corporate Staffing Services, jobs page
  summit:         { enabled: true }  # Summit Recruitment & Search, vacancies feed
  pigiame:        { enabled: true }  # PigiaMe jobs section
  jobrapido:      { enabled: true }  # Jobrapido Kenya, searches for tech roles
  ngo_jobs_africa: { enabled: true } # NGO Jobs in Africa, Kenya posts
  opportunities_for_africans: { enabled: true }  # internships & graduate programmes tagged Kenya
  # --- events ---
  dev_events:   { enabled: true }   # dev.events: conferences, meetups, hackathons

