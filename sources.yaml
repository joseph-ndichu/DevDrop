# Which sources the app scrapes. Set `enabled: false` to turn one off.
#
# Only tech listings whose source states a posting date within the last 48 hours
# are kept; everything else is dropped. Built-in sources are fetched with Scrapling.

refresh_hours: 2   # don't re-scrape a source more often than this

builtin:
  # --- jobs ---
  companies:    { enabled: true }   # career boards of the companies listed below
  hubs:         { enabled: true }   # Amazon, Microsoft & Workday companies' African hubs (see hubs: below)
  early_career: { enabled: true }   # SimplifyJobs internship + new-grad lists, New-Grad-2027
  yc:           { enabled: true }   # Y Combinator startup jobs (HTML page, scraped)
  hn_hiring:    { enabled: true }   # "Ask HN: Who is hiring?" monthly thread
  himalayas:    { enabled: true }   # remote tech jobs API
  jobicy:       { enabled: true }   # remote jobs API (dev, engineering, data science)
  wwr:          { enabled: true }   # We Work Remotely, 6 RSS feeds
  arbeitnow:    { enabled: true }   # Europe (mostly Germany), on-site and remote
  # --- events ---
  dev_events:   { enabled: true }   # dev.events: conferences, meetups, hackathons

# Big employers' engineering hubs in Africa, from their own career-site search.
# Amazon and Microsoft are always checked; add companies whose careers site runs
# on Workday (URL like https://<host>/en-US/<site>) under `workday:`.
hubs:
  countries: [Kenya, South Africa, Nigeria, Egypt, Ghana, Rwanda, Morocco]
  workday:
    Mastercard: { host: mastercard.wd1.myworkdayjobs.com, tenant: mastercard, site: CorporateCareers }
    Absa:       { host: absa.wd3.myworkdayjobs.com, tenant: absa, site: ABSAcareersite }
    Cisco:      { host: cisco.wd5.myworkdayjobs.com, tenant: cisco, site: Cisco_Careers }

